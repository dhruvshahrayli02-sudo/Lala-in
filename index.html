<!DOCTYPE html>
<html>
<head>
    <title>Blink Effect</title>
</head>
<body style="background-color: black; height: 100vh; margin: 0;">

    <script>
        function blinkEffect() {
            document.body.style.backgroundColor = "white";
            setTimeout(() => {
                document.body.style.backgroundColor = "black";
            }, 500);
        }
        window.onload = blinkEffect;
    </script>
</body>
</html>
